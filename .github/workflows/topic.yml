name: Verify Repository Topics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Topics from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching current indexed topics for $REPO..."
          
          # Notice the full API path below:
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com")
          
          # Extract the topics array using standard grep
          TOPICS=$(echo "$RESPONSE" | grep -o '"topics":\s*\[[^]]*\]' || echo '"topics": []')
          
          echo "=========================================="
          echo "API Live Topics Registry:"
          echo "$TOPICS"
          echo "=========================================="
