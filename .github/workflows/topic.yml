name: Verify Repository Topics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Topics from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
         echo "Fetching current indexed topics for $REPO..."

          RESPONSE=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.mercy-preview+json" \
            "https://api.github.com/repos/$REPO/topics")
          
          TOPICS=$(echo "$RESPONSE" | grep -o '"names":\s*
          
          \[[^]]*\]
          
          ' || echo '"names": []')
          
          echo "=========================================="
          echo "API Live Topics Registry:"
          echo "$TOPICS"
          echo "=========================================="
