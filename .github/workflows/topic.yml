name: Verify Repository Topics

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  check-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Topics from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching current indexed topics for $REPO..."
          
          # Call the GitHub API to get repository details
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com")
          
          # Extract and print the topics array
          TOPICS=$(echo "$RESPONSE" | grep -o '"topics":\s*\[[^]*]*\]')
          
          echo "=========================================="
          echo "API Live Topics Registry:"
          echo "$TOPICS"
          echo "=========================================="
